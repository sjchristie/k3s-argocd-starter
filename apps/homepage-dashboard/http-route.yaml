apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-dashboard
  namespace: homepage-dashboard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - homepage.christiehome.work
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: homepage-dashboard
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
