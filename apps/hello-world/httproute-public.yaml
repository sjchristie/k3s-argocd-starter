apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-world-public
  namespace: hello-world
spec:
  parentRefs:
    - name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - demo.christiehome.work
  rules:
    - backendRefs:
        - name: hello-world
          port: 80
