apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  namespace: searxng
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - search.christiehome.work
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: searxng
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
