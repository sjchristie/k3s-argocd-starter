apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/sjchristie/k3s-argocd-starter.git
    targetRevision: scratch
    path: infra/storage/openebs
    plugin:
      name: kustomize-build-with-helm
  destination:
    server: https://kubernetes.default.svc
    namespace: openebs
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
