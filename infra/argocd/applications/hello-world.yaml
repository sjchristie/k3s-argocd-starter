apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: https://github.com/sjchristie/k3s-argocd-starter.git
    targetRevision: scratch
    path: apps/hello-world
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world
