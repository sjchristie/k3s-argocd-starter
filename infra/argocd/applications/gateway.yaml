apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/sjchristie/k3s-argocd-starter.git
    targetRevision: scratch
    path: infra/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
