apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/sjchristie/k3s-argocd-starter.git
        revision: scratch
        directories:
          - path: apps/*
          - path: apps/lb-test
            exclude: true
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: applications
      source:
        repoURL: https://github.com/sjchristie/k3s-argocd-starter.git
        targetRevision: scratch
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
