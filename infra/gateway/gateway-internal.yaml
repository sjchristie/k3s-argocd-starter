apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-internal
  namespace: gateway
spec:
  addresses:
    - type: IPAddress
      value: 192.168.30.220
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.christiehome.work"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-christiehome-work-tls
      allowedRoutes:
        namespaces:
          from: All
