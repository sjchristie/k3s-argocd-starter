apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-external
  namespace: gateway
spec:
  addresses:
  - type: IPAddress
    value: 192.168.30.221
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.christiehome.work"
      tls:
        certificateRefs:
          - name: wildcard-christiehome-work-tls
            kind: Secret
            group: "" # required
      allowedRoutes:
        namespaces:
          from: All
