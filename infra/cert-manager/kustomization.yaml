apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keep only actual Kubernetes manifests here
resources:
  - ns.yaml

# Reference your Helm chart and its values file here instead
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.19.4
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml

